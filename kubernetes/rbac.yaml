# after applying
#
# to get a token run
# kubectl create token -n otel-demo account-otel-demo-manager-kwaab
apiVersion: v1
kind: Namespace
metadata:
  name: otel-demo
---
kind: ServiceAccount
apiVersion: v1
metadata:
  namespace: otel-demo
  name: account-otel-demo-manager-kwaab

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: otel-demo
  name: role-otel-demo-manager-kwaab
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["chaos-mesh.org"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-otel-demo-manager-kwaab
  namespace: otel-demo
subjects:
  - kind: ServiceAccount
    name: account-otel-demo-manager-kwaab
    namespace: otel-demo
roleRef:
  kind: Role
  name: role-otel-demo-manager-kwaab
  apiGroup: rbac.authorization.k8s.io
